spring:
  application:
    name: inventory

  # 로컬 DB 접속 정보. compose.yaml과 같다.
  # bootRun과 테스트에서는 쓰이지 않는다. docker-compose 지원과 Testcontainers가 컨테이너의 접속 정보를 주입해 덮어쓴다.
  # jar로 실행할 때(docker compose up -d 후 java -jar)만 이 값으로 붙으며, 환경 변수(SPRING_DATASOURCE_URL 등)로 덮어쓸 수 있다.
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: inventory
    password: inventory

  jpa:
    # 스키마는 Flyway가 관리한다. Hibernate는 기동 시 엔티티 매핑이 실제 스키마와 맞는지만 검증한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    # 같은 멱등 키가 동시에 들어오면 UNIQUE 위반은 예상된 경로다(트랜잭션 밖에서 처음 결과를 다시 돌려준다). Hibernate의 WARN 로그만 낮춘다.
    org.hibernate.orm.jdbc.error: ERROR
